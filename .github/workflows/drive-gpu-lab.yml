name: Drive GPU Lab

on:
  push:
    branches: [main]
    paths:
      - 'tools/drive-gpu-lab/**'
      - '.github/workflows/drive-gpu-lab.yml'
  pull_request:
    paths:
      - 'tools/drive-gpu-lab/**'
      - '.github/workflows/drive-gpu-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python / collector / PanVK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependency
        run: python -m pip install pytest==9.0.2
      - name: Source syntax
        run: python -m compileall -q tools/drive-gpu-lab/android
      - name: Unit and integration tests
        env:
          PYTHONPATH: tools/drive-gpu-lab/android
        run: python -m pytest tools/drive-gpu-lab/tests -q

  windows-x64:
    name: Windows x64 binary (Go)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
      - name: Go vet
        working-directory: tools/drive-gpu-lab/windows
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: go vet ./...
      - name: Build Windows x64
        working-directory: tools/drive-gpu-lab/windows
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags='-s -w' -o GPU-Lab.exe .
      - name: Verify PE and SHA256
        run: |
          file tools/drive-gpu-lab/windows/GPU-Lab.exe | grep 'PE32+ executable'
          sha256sum tools/drive-gpu-lab/windows/GPU-Lab.exe
